name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    name: tests y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: tipos de los paquetes
        run: pnpm -r --filter './packages/**' exec tsc --noEmit -p tsconfig.json
      - name: tipos del servidor Node
        run: pnpm --filter @all-draw/server typecheck
      - name: tipos de la web
        run: pnpm --filter web exec tsc --noEmit -p tsconfig.app.json

  audit:
    name: auditoría de dependencias
    runs-on: ubuntu-latest
    # Informativo: un aviso sin versión corregida no debe bloquear el resto.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  worker:
    name: worker (workerd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: tipos del worker
        run: pnpm --filter @all-draw/worker typecheck
      - name: tests en workerd (Durable Objects, D1 y WebSocket reales)
        run: pnpm --filter @all-draw/worker test

  build:
    name: build de la web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: e2e (chromium del runner)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: apps/web/dist }
      - name: e2e
        run: |
          pnpm --filter web preview --port 4173 --host 127.0.0.1 &
          (cd apps/server && PORT=4002 STATIC_DIR=../web/dist LOG_LEVEL=warn DATA_DIR=$RUNNER_TEMP/alldraw node src/server.mjs &)
          sleep 3
          CHROME=$(which chromium chromium-browser google-chrome 2>/dev/null | head -1); [ -n "$CHROME" ] && sed -i "s#/usr/bin/chromium#$CHROME#" e2e/*.mjs
          pnpm e2e
