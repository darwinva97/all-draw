  <rect x="40" y="256" width="16" height="16" rx="3" fill="#85BBF0" stroke="#85BBF0" stroke-width="1" opacity="0.4"/>
  <text x="66" y="269" font-size="13" fill="#1f2937" opacity="0.4">Componente</text>
