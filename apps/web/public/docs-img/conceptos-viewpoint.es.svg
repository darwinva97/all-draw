<svg xmlns="http://www.w3.org/2000/svg" width="680" height="344" viewBox="0 0 680 344" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img">
  <title>Viewpoint: la paleta atenúa, no prohíbe</title>
  <desc>Paleta de una vista C4 con viewpoint Contexto: persona, sistema de software y límite aparecen normales; contenedor, componente y nodo de despliegue aparecen atenuados. Aun así, un contenedor arrastrado al lienzo se crea, y el panel de problemas muestra un aviso.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="ah-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#334155" stroke-width="1.6"/></marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="ah-blue-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2563eb" stroke-width="1.6"/></marker>
    <marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="680" height="344" fill="#ffffff"/>
  <rect x="20" y="24" width="240" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="36" y="50" font-size="13" font-weight="700" fill="#334155">Paleta · C4</text>
  <text x="36" y="70" font-size="12" fill="#475569">Viewpoint de la vista: Contexto</text>
  <rect x="32" y="86" width="216" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="40" y="92" width="16" height="16" rx="3" fill="#08427B" stroke="#08427B" stroke-width="1"/>
  <text x="66" y="105" font-size="13" fill="#1f2937">Persona</text>
  <rect x="32" y="120" width="216" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="40" y="126" width="16" height="16" rx="3" fill="#1168BD" stroke="#1168BD" stroke-width="1"/>
  <text x="66" y="139" font-size="13" fill="#1f2937">Sistema de software</text>
  <rect x="32" y="154" width="216" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="40" y="160" width="16" height="16" rx="3" fill="#F5F5F5" stroke="#64748b" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="66" y="173" font-size="13" fill="#1f2937">Límite</text>
  <text x="36" y="206" font-size="12" fill="#64748b" font-style="italic">atenuados: fuera del viewpoint</text>
  <rect x="32" y="216" width="216" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" opacity="0.4"/>
  <rect x="40" y="222" width="16" height="16" rx="3" fill="#438DD5" stroke="#438DD5" stroke-width="1" opacity="0.4"/>
  <text x="66" y="235" font-size="13" fill="#1f2937" opacity="0.4">Contenedor</text>
