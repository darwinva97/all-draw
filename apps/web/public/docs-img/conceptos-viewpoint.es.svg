  <rect x="40" y="290" width="16" height="16" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1" stroke-dasharray="3 2" opacity="0.4"/>
  <text x="66" y="303" font-size="13" fill="#1f2937" opacity="0.4">Nodo de despliegue</text>
  <rect x="300" y="24" width="360" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
