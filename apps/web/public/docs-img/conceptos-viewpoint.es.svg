  <rect x="316" y="252" width="328" height="56" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="330" y="274" font-size="12" font-weight="700" fill="#92400e">▲ Aviso en el panel de problemas</text>
  <text x="330" y="294" font-size="12" fill="#92400e">«API de clientes» no pertenece al viewpoint</text>
