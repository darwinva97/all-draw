  <rect x="510" y="74" width="130" height="56" rx="4" fill="#1168BD" stroke="#0b4884" stroke-width="1.2"/>
  <text x="575" y="100" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">CRM</text>
  <text x="575" y="117" font-size="12" fill="#dbeafe" text-anchor="middle">Sistema de software</text>
  <line x1="445" y1="102" x2="507" y2="102" stroke="#475569" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#ah)"/>
  <text x="476" y="94" font-size="12" fill="#475569" text-anchor="middle">Usa</text>
  <rect x="510" y="176" width="130" height="56" rx="4" fill="#438DD5" stroke="#2f6ea8" stroke-width="1.2"/>
  <text x="575" y="202" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">API de clientes</text>
  <text x="575" y="219" font-size="12" fill="#e0ecfb" text-anchor="middle">Contenedor</text>
  <path d="M644 159 L656 180 L632 180 Z" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="644" y="177" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
