# all-draw en Cloudflare: Worker (API Hono + WebSocket) + Durable Objects con SQLite (RegistryDO: cuentas y
# permisos; WorkspaceDO: un doc Yjs por espacio) + Assets (la app web compilada). D1 es opcional.
# Ver README.md para los pasos de despliegue.
name = "alldraw"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

# La app web compilada (`pnpm --filter web build`). La API y el WebSocket pasan primero por el worker;
# el resto lo sirve Assets con fallback SPA a index.html.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/", "/index.html", "/api", "/api/*", "/healthz", "/ws/*", "/embed/*", "/.well-known/security.txt"]

# D1 (opcional). Sin este bloque, el registro vive en el SQLite del Durable Object `RegistryDO` y no hace
# falta crear ninguna base D1. Para usar D1 en su lugar:
#   1. npx wrangler d1 create alldraw        (copia el id a database_id)
#   2. descomenta el bloque
#   3. pnpm --filter @all-draw/worker migrate   (= wrangler d1 migrations apply alldraw --remote)
# Con `DB` presente el worker usa D1 y el RegistryDO queda sin uso (sus datos NO se copian solos).
# [[d1_databases]]
# binding = "DB"
# database_name = "alldraw"
# database_id = "REEMPLAZA-CON-EL-ID-DE-wrangler-d1-create"
# migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "WORKSPACES"
class_name = "WorkspaceDO"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "RegistryDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RegistryDO"]

[vars]
ALLOW_REGISTRATION = "false"
PUBLIC_URL = "https://alldraw.darwin-sva-97.workers.dev"
# Instancia del registro (RegistryDO). La "registry" original quedó con una cuenta de prueba el 29-09-2026.
REGISTRY_NAME = "registry-2"
# Copia de respaldo de solo lectura del VPS (el entorno principal): la API rechaza las escrituras (503 `standby`) salvo
# entrar y salir, los WebSocket entran como viewer y la web muestra un aviso fijo. La sincroniza cada noche
# `scripts/sync-standby.mjs` (POST /api/admin/import con replace: true y X-Import-Secret). "false" lo desactiva.
STANDBY = "true"
PRIMARY_URL = "https://alldraw.bezenti.com"
# SESSION_SECRET: ponlo como secreto → `wrangler secret put SESSION_SECRET`
# IMPORT_SECRET: con STANDBY es la clave de la sincronización nocturna → `wrangler secret put IMPORT_SECRET`
#   (el VPS la lee de ~/.config/alldraw/cf-import-secret). Sin STANDBY sólo vale con el registro vacío (migración).

# Rate limiting de Workers (src/ratelimit.ts): por IP y por ubicación de Cloudflare; period = 10 o 60 s. Los ids de
# namespace son de la cuenta (no los repitas en otro worker salvo para compartir contadores). Son opcionales: si el
# plan no los admite, comenta los bloques y siguen valiendo los límites en memoria de la API.
[[ratelimits]]
name = "RL_LOGIN"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_REGISTER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "RL_LINKS"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

[observability]
enabled = true
