# all-draw en Cloudflare: Worker (API Hono + WebSocket) + D1 (cuentas, permisos) + Durable Objects (un doc Yjs por espacio)
# + Assets (la app web compilada). Ver README.md para los pasos de despliegue.
name = "alldraw"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

# La app web compilada (`pnpm --filter web build`). La API y el WebSocket pasan primero por el worker;
# el resto lo sirve Assets con fallback SPA a index.html.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*", "/healthz", "/ws/*"]

[[d1_databases]]
binding = "DB"
database_name = "alldraw"
database_id = "REEMPLAZA-CON-EL-ID-DE-wrangler-d1-create"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "WORKSPACES"
class_name = "WorkspaceDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkspaceDO"]

[vars]
ALLOW_REGISTRATION = "true"
# PUBLIC_URL = "https://alldraw.example.com"
# SESSION_SECRET: ponlo como secreto → `wrangler secret put SESSION_SECRET`

[observability]
enabled = true
